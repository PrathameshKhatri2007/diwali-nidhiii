<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stopColor="#E8B04A" />
      <stop offset="40%" stopColor="#F5D68A" />
      <stop offset="100%" stopColor="#FFF3E6" />
    </linearGradient>
    <!-- Base Clay/Gold Gradient -->
    <linearGradient id="diyaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#E8B04A" />
      <stop offset="50%" stopColor="#8A1C3E" />
      <stop offset="100%" stopColor="#3A0A1E" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Flame Halo Glow -->
  <circle cx="32" cy="22" r="14" fill="#F5D68A" opacity="0.3" filter="url(#softGlow)" />

  <!-- Outer Flame -->
  <path
    d="M 32 8 C 37 16, 40 23, 36 29 C 33 33, 31 33, 28 29 C 24 23, 27 16, 32 8 Z"
    fill="url(#flameGrad)"
  />

  <!-- Inner Flame Core -->
  <ellipse cx="32" cy="24" rx="2.5" ry="5.5" fill="#FFF3E6" />

  <!-- Diya Base (Traditional Clay Lamp) -->
  <path
    d="M 12 36 C 14 48, 50 48, 52 36 C 44 41, 20 41, 12 36 Z"
    fill="url(#diyaGrad)"
    stroke="#F5D68A"
    stroke-width="1.5"
  />

  <!-- Diya Rim Highlight -->
  <path
    d="M 12 36 Q 32 40 52 36"
    fill="none"
    stroke="#FFF3E6"
    stroke-width="1"
    opacity="0.8"
  />

  <!-- Wick Tip -->
  <line x1="32" y1="36" x2="32" y2="30" stroke="#2A0F45" stroke-width="1.5" stroke-linecap="round" />
</svg>

